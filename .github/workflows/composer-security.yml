name: Composer Security Audit

on:
  push:
    branches: ["main", "chore/release-audit-and-plugin-matrix"]
  pull_request:
    branches: ["main", "feat/cms-editorial-workflow"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composer-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-security:
    name: Validate lockfile and audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3 and Composer 2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer security-validate

      - name: Audit locked production and development dependencies
        run: composer security-audit
