name: Flutter Instructor App

on:
  pull_request:
    paths:
      - 'apps/instructor_app/**'
      - '.github/workflows/flutter-instructor-app.yml'
  push:
    branches: [main]
    paths:
      - 'apps/instructor_app/**'
      - '.github/workflows/flutter-instructor-app.yml'

permissions:
  contents: read

concurrency:
  group: flutter-instructor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instructor-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/instructor_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --reporter expanded
