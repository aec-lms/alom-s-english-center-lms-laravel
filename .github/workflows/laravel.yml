name: Laravel

on:
  push:
    branches: ["main", "fix/laravel-ci-php83", "feature/**"]
  pull_request:
    branches: ["main", "feat/cms-post-management-hardening"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, pdo_mysql, xml, curl, ctype, tokenizer, bcmath, sodium
          coverage: none

      - name: Copy environment
        run: cp .env.example .env

      - name: Prepare writable directories
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: PHP syntax lint across application and plugins
        run: |
          find app bootstrap config database plugins public routes tests ../tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Compile all Blade views
        run: |
          php artisan view:cache
          php artisan view:clear

      - name: Composer security audit
        run: composer audit --locked --no-interaction

      - name: Generate application key
        run: php artisan key:generate

      - name: Verify backup runtime requirements
        run: php artisan lms:backup:requirements

      - name: Execute Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test

      - name: Setup Node.js for browser E2E
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.52.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute attendance offline browser E2E
        run: node tests/e2e/attendance-offline.spec.cjs

      - name: Execute attendance PWA restart/offline E2E
        run: node tests/e2e/attendance-pwa.spec.cjs

      - name: Execute attendance QR expiry/replay browser E2E
        run: node tests/e2e/attendance-qr-checkin.spec.cjs

      - name: Build production cPanel package
        run: bash scripts/build-cpanel-package.sh

      - name: Verify production package contents
        run: |
          python3 - <<'PY'
          import zipfile
          archive = "dist/aec-lms-cpanel-release.zip"
          with zipfile.ZipFile(archive) as package:
              files = {
                  name.removeprefix("./").rstrip("/")
                  for name in package.namelist()
                  if not name.endswith("/")
              }
          required = {".env.example", "composer.lock", "vendor/autoload.php", "artisan", "public/index.php"}
          missing = required - files
          if missing:
              raise SystemExit(f"Release package missing required files: {sorted(missing)}")
          forbidden = [
              "storage/app/installed.lock",
              "storage/app/backups/",
              "storage/app/private/",
              "storage/app/restore-staging/",
              "storage/app/plugin-staging/",
              "storage/app/plugin-rollbacks/",
              "storage/app/update-staging/",
              "storage/app/update-snapshots/",
              ".git/",
              "node_modules/",
          ]
          leaked = [
              name for name in files
              if any(name.startswith(prefix) for prefix in forbidden)
          ]
          env_leaks = [
              name for name in files
              if name.rsplit("/", 1)[-1].startswith(".env")
              and name.rsplit("/", 1)[-1] != ".env.example"
          ]
          if leaked or env_leaks:
              raise SystemExit(f"Release package contains private/runtime data: {sorted(leaked + env_leaks)}")
          print(f"Verified {len(files)} files in {archive}")
          PY

      - name: Upload verified cPanel release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aec-lms-cpanel-release
          path: |
            laravel/dist/aec-lms-cpanel-release.zip
            laravel/dist/aec-lms-cpanel-release.zip.sha256
          if-no-files-found: error
          retention-days: 14

  laravel-mysql-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aec_lms_test
          MYSQL_USER: aec_lms
          MYSQL_PASSWORD: aec_lms_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: aec_lms_test
      DB_USERNAME: aec_lms
      DB_PASSWORD: aec_lms_test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      AEC_TEST_EXPLICIT_PLUGIN_BOOT: "1"
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, pdo_mysql, xml, curl, ctype, tokenizer, bcmath, sodium
          coverage: none
      - name: Copy environment
        run: cp .env.example .env
      - name: Prepare writable directories
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Composer security audit
        run: composer audit --locked --no-interaction
      - name: Generate application key
        run: php artisan key:generate
      - name: Verify backup runtime requirements
        run: php artisan lms:backup:requirements
      - name: Execute Laravel tests on MySQL 8.0
        run: php artisan test
