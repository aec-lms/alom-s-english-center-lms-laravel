name: Flutter Student App

on:
  pull_request:
    paths:
      - 'apps/student_app/**'
      - '.github/workflows/flutter-student-app.yml'
  push:
    branches: [main]
    paths:
      - 'apps/student_app/**'
      - '.github/workflows/flutter-student-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/student_app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: false
      - name: Generate native platform scaffolding
        run: flutter create --platforms=android,ios --project-name aloms_student_app .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://www.alomsenglishcenter.com/api/v1
